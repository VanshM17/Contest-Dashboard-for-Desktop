<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Contest Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wallpaper-container">
        <div class="overlay">
            <div class="panel-header">
                <div class="panel-title-group">
                    <span class="eyebrow">Competitive Programming</span>
                    <h1>Upcoming Contests</h1>
                </div>
                <div class="panel-meta"><span class="dot"></span>Live · synced hourly</div>
            </div>
            <div id="contest-list" class="contest-list">
                <p class="loading">Loading schedule...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
